name: Release Tags

on:
  push:
    branches:
      - main

permissions: {}

# Tag pushes must not race when merges land back-to-back
concurrency:
  group: release-tags

jobs:
  tag:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: depot-ubuntu-24.04
    # A hung push must not block the serialized concurrency group for the
    # default 6h job timeout
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create release tags
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/release-tags.sh "$BASE_SHA" "$HEAD_SHA"
