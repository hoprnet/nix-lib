name: PR

on:
  pull_request:
    # "edited" re-runs the title lint when the PR title is fixed
    types: [opened, edited, reopened, synchronize]
  # Kept from the former nix-checks.yaml: flake checks also run on main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true

jobs:
  # The PR title becomes the squash commit on main, which release-tags.sh
  # parses to derive the version bump
  conventional-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title against conventional commits
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false

  flake-check:
    name: Run flake checks
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Run nix flake check
        uses: hoprnet/hopr-workflows/actions/nix-action@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # nix-action-v2.0.0
        with:
          repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: nix flake check -L

  check-binary-cache:
    name: Check packages cached on cache.nixos.org
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify package store paths are cached
        uses: hoprnet/hopr-workflows/actions/nix-action@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # nix-action-v2.0.0
        with:
          repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: ./scripts/check-binary-cache.sh

  # The flake checks validate the image tarball. This job repeats the audit
  # inside a running container, so the check covers the image as it boots.
  docker-trust-store:
    name: Check Docker trust store
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Audit the trust store inside the image
        uses: hoprnet/hopr-workflows/actions/nix-action@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # nix-action-v2.0.0
        with:
          repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: |
            set -euo pipefail
            image="$(nix build .#dockerTrustStoreAudit --no-link --print-out-paths)"
            docker load --input "$image"
            docker run --rm nix-lib-trust-store-audit:latest

  # Single required check for the branch ruleset. `if: always()` runs it even
  # when a dependency fails; alls-green reds the gate on any non-success.
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - conventional-title
      - flake-check
      - check-binary-cache
      - docker-trust-store
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # Validate title runs on pull_request only
          allowed-skips: ${{ github.event_name != 'pull_request' && 'conventional-title' || '' }}
